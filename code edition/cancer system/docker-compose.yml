services:
  cancer-risk-app:
    build: .
    container_name: cancer-risk-app
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: "${SECRET_KEY:-change-this-secret-in-production}"
      DATABASE_PATH: /app/data/users.db
    volumes:
      - cancer-risk-data:/app/data
    restart: unless-stopped

volumes:
  cancer-risk-data:
