<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breast Cancer Prediction - Cancer Risk Prediction System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <h1>🎀 Breast Cancer Risk Prediction</h1>
            <p class="subtitle">Enter patient measurements to predict breast cancer risk</p>
            <a href="/" class="back-link">← Back to Home</a>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="form-container">
                <h2>Patient Measurement Data</h2>
                <p class="form-description">Please enter the following measurements for the patient:</p>

                <form id="breastForm">
                    <div class="form-group">
                        <label for="radius_mean">
                            Radius Mean <span class="required">*</span>
                            <span class="help-text">(Average distance from center to perimeter)</span>
                        </label>
                        <input 
                            type="number" 
                            id="radius_mean" 
                            name="radius_mean" 
                            placeholder="e.g., 15.5" 
                            step="0.1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="texture_mean">
                            Texture Mean <span class="required">*</span>
                            <span class="help-text">(Standard deviation of gray-scale values)</span>
                        </label>
                        <input 
                            type="number" 
                            id="texture_mean" 
                            name="texture_mean" 
                            placeholder="e.g., 19.0" 
                            step="0.1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="perimeter_mean">
                            Perimeter Mean <span class="required">*</span>
                            <span class="help-text">(Perimeter around the cell nucleus)</span>
                        </label>
                        <input 
                            type="number" 
                            id="perimeter_mean" 
                            name="perimeter_mean" 
                            placeholder="e.g., 102.5" 
                            step="0.1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="area_mean">
                            Area Mean <span class="required">*</span>
                            <span class="help-text">(Area of the cell nucleus)</span>
                        </label>
                        <input 
                            type="number" 
                            id="area_mean" 
                            name="area_mean" 
                            placeholder="e.g., 800.0" 
                            step="0.1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="concavity_mean">
                            Concavity Mean <span class="required">*</span>
                            <span class="help-text">(Severity of concave portions)</span>
                        </label>
                        <input 
                            type="number" 
                            id="concavity_mean" 
                            name="concavity_mean" 
                            placeholder="e.g., 0.08" 
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="symmetry_mean">
                            Symmetry Mean <span class="required">*</span>
                            <span class="help-text">(Symmetry of the nucleus)</span>
                        </label>
                        <input 
                            type="number" 
                            id="symmetry_mean" 
                            name="symmetry_mean" 
                            placeholder="e.g., 0.15" 
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">🔍 Predict Cancer Risk</button>
                        <button type="reset" class="btn btn-secondary">↻ Clear Form</button>
                    </div>
                </form>

                <!-- Loading indicator -->
                <div id="loadingSpinner" class="loading-spinner hidden">
                    <div class="spinner"></div>
                    <p>Processing prediction...</p>
                </div>

                <!-- Result section (hidden initially) -->
                <div id="resultSection" class="result-section hidden">
                    <!-- Results will be displayed here by JavaScript -->
                </div>

                <!-- Error message (hidden initially) -->
                <div id="errorMessage" class="error-message hidden"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>&copy; 2024 Cancer Risk Prediction System | Final Year Project</p>
        </div>
    </div>

    <script>
        // Handle form submission
        document.getElementById('breastForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Show loading spinner
            document.getElementById('loadingSpinner').classList.remove('hidden');
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
            
            try {
                // Collect form data
                const formData = {
                    radius_mean: document.getElementById('radius_mean').value,
                    texture_mean: document.getElementById('texture_mean').value,
                    perimeter_mean: document.getElementById('perimeter_mean').value,
                    area_mean: document.getElementById('area_mean').value,
                    concavity_mean: document.getElementById('concavity_mean').value,
                    symmetry_mean: document.getElementById('symmetry_mean').value
                };
                
                // Send prediction request to backend
                const response = await fetch('/predict/breast', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                // Parse response
                const data = await response.json();
                
                // Hide loading spinner
                document.getElementById('loadingSpinner').classList.add('hidden');
                
                if (data.success) {
                    // Display results
                    const resultHTML = `
                        <div class="result-success">
                            <h3>✅ Prediction Results</h3>
                            <div class="result-box">
                                <div class="result-row">
                                    <span class="result-label">Cancer Type:</span>
                                    <span class="result-value">${data.cancer_type}</span>
                                </div>
                                <div class="result-row highlight">
                                    <span class="result-label">Prediction:</span>
                                    <span class="result-value prediction-${data.prediction.includes('Benign') ? 'benign' : 'malignant'}">
                                        ${data.prediction}
                                    </span>
                                </div>
                                <div class="result-row">
                                    <span class="result-label">Confidence:</span>
                                    <span class="result-value">${data.confidence}</span>
                                </div>
                                <div class="result-row">
                                    <span class="result-label">Probability (Benign):</span>
                                    <span class="result-value">${data.probability_benign}</span>
                                </div>
                                <div class="result-row">
                                    <span class="result-label">Probability (Malignant):</span>
                                    <span class="result-value">${data.probability_malignant}</span>
                                </div>
                            </div>
                            <div class="result-actions">
                                <button onclick="location.href='/'" class="btn btn-primary">🏠 Home</button>
                                <button onclick="location.href='/breast'" class="btn btn-secondary">➕ Another Prediction</button>
                            </div>
                        </div>
                    `;
                    document.getElementById('resultSection').innerHTML = resultHTML;
                    document.getElementById('resultSection').classList.remove('hidden');
                } else {
                    // Show error message
                    document.getElementById('errorMessage').textContent = `Error: ${data.error}`;
                    document.getElementById('errorMessage').classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('loadingSpinner').classList.add('hidden');
                document.getElementById('errorMessage').textContent = `Error: ${error.message}`;
                document.getElementById('errorMessage').classList.remove('hidden');
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
