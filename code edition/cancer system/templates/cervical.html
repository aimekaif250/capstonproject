<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cervical Cancer Prediction - Cancer Risk Prediction System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <h1>🏥 Cervical Cancer Risk Prediction</h1>
            <p class="subtitle">Enter patient history data to predict cervical cancer risk</p>
            <a href="/" class="back-link">← Back to Home</a>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="form-container">
                <h2>Patient History Data</h2>
                <p class="form-description">Please provide the following information about the patient:</p>

                <form id="cervicalForm">
                    <div class="form-group">
                        <label for="age">
                            Age (Years) <span class="required">*</span>
                            <span class="help-text">(Patient's current age)</span>
                        </label>
                        <input 
                            type="number" 
                            id="age" 
                            name="age" 
                            placeholder="e.g., 35" 
                            min="1"
                            max="120"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="hpv">
                            HPV Status <span class="required">*</span>
                            <span class="help-text">(Human Papillomavirus)</span>
                        </label>
                        <select id="hpv" name="hpv" required>
                            <option value="">-- Select HPV Status --</option>
                            <option value="0">Negative (0)</option>
                            <option value="1">Positive (1)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="smoking">
                            Smoking Status <span class="required">*</span>
                            <span class="help-text">(Current or past smoking history)</span>
                        </label>
                        <select id="smoking" name="smoking" required>
                            <option value="">-- Select Smoking Status --</option>
                            <option value="0">Non-Smoker (0)</option>
                            <option value="1">Smoker (1)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="pregnancies">
                            Number of Pregnancies <span class="required">*</span>
                            <span class="help-text">(Total number of pregnancies)</span>
                        </label>
                        <input 
                            type="number" 
                            id="pregnancies" 
                            name="pregnancies" 
                            placeholder="e.g., 2" 
                            min="0"
                            max="20"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="std_history">
                            STD History <span class="required">*</span>
                            <span class="help-text">(Sexually Transmitted Disease history)</span>
                        </label>
                        <select id="std_history" name="std_history" required>
                            <option value="">-- Select STD History --</option>
                            <option value="0">No STD History (0)</option>
                            <option value="1">STD History Present (1)</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">🔍 Predict Cancer Risk</button>
                        <button type="reset" class="btn btn-secondary">↻ Clear Form</button>
                    </div>
                </form>

                <!-- Loading indicator -->
                <div id="loadingSpinner" class="loading-spinner hidden">
                    <div class="spinner"></div>
                    <p>Processing prediction...</p>
                </div>

                <!-- Result section (hidden initially) -->
                <div id="resultSection" class="result-section hidden">
                    <!-- Results will be displayed here by JavaScript -->
                </div>

                <!-- Error message (hidden initially) -->
                <div id="errorMessage" class="error-message hidden"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>&copy; 2024 Cancer Risk Prediction System | Final Year Project</p>
        </div>
    </div>

    <script>
        // Handle form submission
        document.getElementById('cervicalForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Show loading spinner
            document.getElementById('loadingSpinner').classList.remove('hidden');
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
            
            try {
                // Collect form data
                const formData = {
                    age: document.getElementById('age').value,
                    hpv: document.getElementById('hpv').value,
                    smoking: document.getElementById('smoking').value,
                    pregnancies: document.getElementById('pregnancies').value,
                    std_history: document.getElementById('std_history').value
                };
                
                // Send prediction request to backend
                const response = await fetch('/predict/cervical', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                // Parse response
                const data = await response.json();
                
                // Hide loading spinner
                document.getElementById('loadingSpinner').classList.add('hidden');
                
                if (data.success) {
                    // Display results
                    const resultHTML = `
                        <div class="result-success">
                            <h3>✅ Prediction Results</h3>
                            <div class="result-box">
                                <div class="result-row">
                                    <span class="result-label">Cancer Type:</span>
                                    <span class="result-value">${data.cancer_type}</span>
                                </div>
                                <div class="result-row highlight">
                                    <span class="result-label">Prediction:</span>
                                    <span class="result-value prediction-${data.prediction.includes('No Cancer') ? 'safe' : 'risk'}">
                                        ${data.prediction}
                                    </span>
                                </div>
                                <div class="result-row">
                                    <span class="result-label">Confidence:</span>
                                    <span class="result-value">${data.confidence}</span>
                                </div>
                                <div class="result-row">
                                    <span class="result-label">Probability (No Cancer):</span>
                                    <span class="result-value">${data.probability_no_cancer}</span>
                                </div>
                                <div class="result-row">
                                    <span class="result-label">Probability (Cancer Risk):</span>
                                    <span class="result-value">${data.probability_cancer}</span>
                                </div>
                            </div>
                            <div class="result-actions">
                                <button onclick="location.href='/'" class="btn btn-primary">🏠 Home</button>
                                <button onclick="location.href='/cervical'" class="btn btn-secondary">➕ Another Prediction</button>
                            </div>
                        </div>
                    `;
                    document.getElementById('resultSection').innerHTML = resultHTML;
                    document.getElementById('resultSection').classList.remove('hidden');
                } else {
                    // Show error message
                    document.getElementById('errorMessage').textContent = `Error: ${data.error}`;
                    document.getElementById('errorMessage').classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('loadingSpinner').classList.add('hidden');
                document.getElementById('errorMessage').textContent = `Error: ${error.message}`;
                document.getElementById('errorMessage').classList.remove('hidden');
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
